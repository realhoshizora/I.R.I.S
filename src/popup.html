<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>I.R.I.S</title>
<link rel="stylesheet" href="app.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  .frame { padding: 10px 12px 14px; }
  .pop { background: var(--band); border-radius: 6px; padding: 10px 12px 14px 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38), 0 1px 3px rgba(0, 0, 0, 0.3); }
  .bar { display: flex; align-items: center; gap: 6px; }
  .arrow { color: var(--ink-3); font-size: 12px; }
  .engine { margin-left: 6px; font-size: 11px; color: var(--ink-3); }
  .actions { margin-left: auto; display: flex; gap: 2px; }
  .cues { max-height: 360px; overflow-y: auto; overscroll-behavior: contain; }
  .cues > * { animation: cue 0.32s var(--ease-out) both; }
  .cues > *:nth-child(2) { animation-delay: 0.08s; }
  .cues > *:nth-child(3) { animation-delay: 0.16s; }
  @keyframes cue { from { opacity: 0.2; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .src { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .tl { margin: 4px 0 0; font-size: 18px; font-weight: 600; line-height: 1.42; color: var(--sub); text-shadow: 0 1px 0 #000, 0 0 2px #000; white-space: pre-wrap; user-select: text; }
  .tl.pending { color: var(--ink-3); font-weight: 400; font-size: 15px; text-shadow: none; }
  .head { margin-top: 10px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
  .head .w { font-size: 24px; font-weight: 700; line-height: 1.25; }
  .head .r { color: var(--ink-2); font-size: 14px; }
  .pos { margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
  .pos dt { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: var(--ink-3); text-transform: uppercase; white-space: nowrap; }
  .pos dd { margin: 0; color: var(--sub); font-weight: 600; font-size: 15px; }
  .err { margin: 10px 0 0; color: var(--err); font-size: 14px; }
  .retry { margin-top: 10px; font: 600 13px var(--font); color: var(--band); background: var(--sub); border: 0; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  .retry:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M10.5 5V3.5A1.5 1.5 0 0 0 9 2H3.5A1.5 1.5 0 0 0 2 3.5V9a1.5 1.5 0 0 0 1.5 1.5H5"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></symbol>
  <symbol id="i-pin" viewBox="0 0 16 16"><path d="M9.5 2.5l4 4-2 1-2.5 2.5.5 3-1 1-3-3-3 3M6 7l1.5-3.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
</svg>
<div class="frame">
  <main class="pop" role="dialog" aria-label="Bản dịch">
    <div class="bar">
      <span class="track" id="src-track">…</span><span class="arrow" aria-hidden="true">→</span><span class="track" id="tgt-track">VI</span>
      <span class="engine" id="engine"></span>
      <div class="actions">
        <button class="icon-btn" id="copy" type="button" aria-label="Sao chép bản dịch" title="Sao chép bản dịch"><svg><use href="#i-copy"/></svg></button>
        <button class="icon-btn" id="pin" type="button" aria-label="Ghim popup" title="Ghim: không tự đóng khi bấm ra ngoài" aria-pressed="false"><svg><use href="#i-pin"/></svg></button>
        <button class="icon-btn" id="close" type="button" aria-label="Đóng" title="Đóng (Esc)"><svg><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div class="cues" id="cues" aria-live="polite"></div>
  </main>
</div>
<script src="popup.js"></script>
</body>
</html>
